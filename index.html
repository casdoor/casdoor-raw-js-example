<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casdoor Raw JS Example</title>
  <style>
    .hidden {
      display: none;
    }

    button {
      width: 200px;
      height: 50px;
    }
  </style>
</head>

<body>
  <div style="display: flex; height: 100vh; align-items: center; justify-content: center;">
    <div style="text-align: center;">
      <p id="message"></p>
      <p id="user" class="hidden">Username: <span id="username"></span></p>
      <button id="signIn" class="hidden">Login with Casdoor</button>
      <button id="signOut" class="hidden">Logout</button>
    </div>
  </div>

  <script type="module">
    // casdoor-js-sdk from a CDN, without a framework or a build step
    import SDK from 'https://esm.sh/casdoor-js-sdk@0.21.1'

    // this page and its APIs are served by server.js
    const serverUrl = window.location.origin

    // The Casdoor application, the defaults are the public demo server https://door.casdoor.com
    const sdk = new SDK({
      serverUrl: "https://door.casdoor.com",
      clientId: "294b09fbc17f95daf2fe",
      appName: "app-vue-python-example",
      organizationName: "casbin",
      redirectPath: "/callback",
      signinPath: "/api/signin",
    })

    const message = document.querySelector("#message")
    const user = document.querySelector("#user")
    const username = document.querySelector("#username")
    const signInBtn = document.querySelector("#signIn")
    const signOutBtn = document.querySelector("#signOut")

    function show(signedInUser) {
      user.classList.toggle("hidden", !signedInUser)
      signOutBtn.classList.toggle("hidden", !signedInUser)
      signInBtn.classList.toggle("hidden", !!signedInUser)
      username.textContent = signedInUser ? signedInUser.name : ""
    }

    // the user of the token, read and verified by the backend
    async function getUserInfo() {
      const token = sessionStorage.getItem("token")
      if (!token) {
        return null
      }
      const res = await fetch(`${serverUrl}/api/getUserInfo`, {
        headers: { Authorization: `Bearer ${token}` },
      }).then(res => res.json())
      if (res.status !== "ok") {
        sessionStorage.removeItem("token")
        return null
      }
      return res.data
    }

    signInBtn.addEventListener("click", () => {
      // the URL carries a random state, kept in sessionStorage and checked by sdk.signin()
      window.location.href = sdk.getSigninUrl()
    })

    signOutBtn.addEventListener("click", () => {
      sessionStorage.removeItem("token")
      show(null)
    })

    async function main() {
      if (window.location.pathname === "/callback") {
        // Casdoor redirected back with the code and the state:
        // check the state and exchange the code for a token through the backend
        const res = await sdk.signin(serverUrl)
        if (res.status === "ok") {
          sessionStorage.setItem("token", res.token)
        } else {
          message.textContent = `Failed to sign in: ${res.msg}`
        }
        window.history.replaceState({}, "", "/")
      }
      show(await getUserInfo())
    }

    main()
  </script>
</body>

</html>
